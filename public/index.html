<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Connect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Social Connect</h1>

  <section class="card" id="whatsapp">
    <header>
      <h2>WhatsApp</h2>
      <div class="status"><span class="dot"></span><span class="label">Checking…</span></div>
      <div class="actions">
        <button class="connect">Connect</button>
        <button class="logout secondary">Disconnect</button>
      </div>
    </header>
    <img class="qr" alt="WhatsApp QR code" hidden>
    <p class="hint qr-hint" hidden>Scan with WhatsApp → Linked devices. You only need to do this once.</p>
    <form class="send">
      <input name="number" type="tel" placeholder="Number with country code, e.g. 919876543210" required>
      <textarea name="message" rows="3" placeholder="Message" required></textarea>
      <button type="submit">Send</button>
      <p class="result" role="status"></p>
    </form>
  </section>

  <section class="card" id="linkedin">
    <header>
      <h2>LinkedIn</h2>
      <div class="status"><span class="dot"></span><span class="label">Checking…</span></div>
      <div class="actions">
        <button class="connect">Connect</button>
        <button class="logout secondary">Disconnect</button>
      </div>
    </header>
    <p class="hint login-hint" hidden>Sign in in the Chrome window that opened (password or Google both work).</p>
    <form class="send">
      <input name="url" type="url" placeholder="https://www.linkedin.com/in/username" required>
      <textarea name="message" rows="3" placeholder="Message" required></textarea>
      <button type="submit">Send</button>
      <p class="result" role="status"></p>
    </form>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
