<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Demo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Portal demo</h1>
  <section class="card">
    <input id="extId" placeholder="Extension ID from chrome://extensions" aria-label="Extension ID">
    <p class="result" id="ext" role="status"></p>
  </section>

  <section class="card" id="whatsapp">
    <header>
      <h2>WhatsApp</h2>
      <div class="status"><span class="dot"></span><span class="label">Checking…</span></div>
      <div class="actions"><button class="connect">Connect</button></div>
    </header>
    <form class="send">
      <input name="number" type="tel" placeholder="Number with country code, e.g. 919876543210" required>
      <textarea name="message" rows="3" placeholder="Message" required></textarea>
      <button type="submit">Send</button>
      <p class="result" role="status"></p>
    </form>
  </section>

  <section class="card" id="linkedin">
    <header>
      <h2>LinkedIn</h2>
      <div class="status"><span class="dot"></span><span class="label">Checking…</span></div>
      <div class="actions"><button class="connect">Connect</button></div>
    </header>
    <form class="send">
      <input name="url" type="url" placeholder="https://www.linkedin.com/in/username" required>
      <textarea name="message" rows="3" placeholder="Message" required></textarea>
      <button type="submit">Send</button>
      <p class="result" role="status"></p>
    </form>
  </section>
</main>
<script src="/portal-client.js"></script>
<script>
const LABELS = { connected: 'Connected', disconnected: 'Not connected', pending: 'Connecting…' };
const idBox = document.getElementById('extId');
const extMsg = document.getElementById('ext');
idBox.value = new URLSearchParams(location.search).get('ext') || localStorage.getItem('extId') || '';
idBox.oninput = () => localStorage.setItem('extId', idBox.value.trim());
const client = () => new SocialConnectClient(idBox.value.trim());

function render(id, s) {
  const el = document.getElementById(id);
  el.dataset.state = s.state;
  el.querySelector('.label').textContent = LABELS[s.state];
  el.querySelector('.connect').hidden = s.state !== 'disconnected';
  const form = el.querySelector('form');
  if (form.dataset.sending) return;
  [...form.elements].forEach((c) => (c.disabled = s.state !== 'connected'));
}

async function refresh() {
  try {
    const s = await client().status();
    extMsg.textContent = '';
    render('whatsapp', s.whatsapp);
    render('linkedin', s.linkedin);
  } catch (e) {
    extMsg.className = 'result err';
    extMsg.textContent = e.message;
    render('whatsapp', { state: 'disconnected' });
    render('linkedin', { state: 'disconnected' });
  }
}

for (const id of ['whatsapp', 'linkedin']) {
  const el = document.getElementById(id);
  const form = el.querySelector('form');
  const result = form.querySelector('.result');
  el.querySelector('.connect').onclick = () => client().connect(id).then(refresh).catch((e) => {
    extMsg.className = 'result err';
    extMsg.textContent = e.message;
  });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const body = { service: id, message: form.elements.message.value };
    if (id === 'whatsapp') body.number = form.elements.number.value;
    else body.url = form.elements.url.value;
    form.dataset.sending = '1';
    form.querySelector('button').disabled = true;
    result.className = 'result';
    result.textContent = 'Sending…';
    try {
      const r = await client().send(body);
      result.className = 'result ok';
      result.textContent = r.kind === 'invite' ? 'Invitation sent, with your message as the note.' : 'Sent.';
      form.elements.message.value = '';
    } catch (err) {
      result.className = 'result err';
      result.textContent = err.message;
    } finally {
      delete form.dataset.sending;
      refresh();
    }
  };
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
